<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonome – Version Appli</title>

    <!-- STYLE GLOBAL APPLI (identique au site) -->
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }

        header {
            background-color: #005bbb;
            padding: 15px;
            color: white;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        nav {
            background-color: #003f7f;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .zone-bleue {
            background-color: #3FD1C2;
            padding: 20px;
            text-align: center;
            color: #003f7f;
            font-size: 20px;
            font-weight: bold;
        }

        .content {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            margin-top: 20px;
            border-radius: 8px;
        }

        footer {
            margin-top: 40px;
            background: #003f7f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* FLOUTAGE DES PAGES NON UTILISÉES */
        .floute {
            filter: blur(5px);
            pointer-events: none;
            opacity: 0.5;
        }
    </style>
</head>

<body>

<header data-i18n="header_title">Peuplitique – Application</header>

<nav>
    <a href="index-appli.html" data-i18n="menu_home">Accueil</a>
    <a href="autonome-appli.html" data-i18n="menu_autonome">Autonome</a>
    <a href="contact-appli.html" data-i18n="menu_contact">Contact</a>
</nav>

<div class="zone-bleue" data-i18n="blue_zone">
    Section Autonome – Version Application
</div>

<div class="content">
    <!-- TON TEXTE AUTONOME ICI (je ne touche pas) -->
    <h1 data-i18n="title_autonome">Autonomie</h1>

    <p>
        Ton texte autonome reste ici, intact, non modifié.
    </p>
</div>

<footer>
    <p data-i18n="footer_text">© 2026 Peuplitique – Tous droits réservés</p>
</footer>

<!-- SCRIPT MULTILINGUE (identique au site) -->
<script>
const translations = {
    fr: {
        header_title: "Peuplitique – Application",
        menu_home: "Accueil",
        menu_autonome: "Autonome",
        menu_contact: "Contact",
        blue_zone: "Section Autonome – Version Application",
        title_autonome: "Autonomie",
        footer_text: "© 2026 Peuplitique – Tous droits réservés"
    },
    en: {
        header_title: "Peuplitique – Application",
        menu_home: "Home",
        menu_autonome: "Autonomous",
        menu_contact: "Contact",
        blue_zone: "Autonomous Section – App Version",
        title_autonome: "Autonomy",
        footer_text: "© 2026 Peuplitique – All rights reserved"
    }
};

function applyTranslations(lang) {
    document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (translations[lang] && translations[lang][key]) {
            el.textContent = translations[lang][key];
        }
    });
}

applyTranslations("fr");
</script>

<!-- TON SCRIPT APPLI (normal, on le garde) -->
<script src="script-appli.js"></script>

</body>
</html>
