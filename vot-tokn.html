<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test Token</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="zone">
    <h1>Test Token</h1>

    <button onclick="generer()">Générer un token</button>
    <p id="t"></p>

    <button onclick="valider()">Valider</button>
    <p id="r"></p>
</div>

<script>
let token = null;
let actif = false;

function generer() {
    token = "TKN-" + Math.floor(Math.random() * 999999);
    actif = true;
    document.getElementById("t").innerText = "Token : " + token;
    document.getElementById("r").innerText = "";
}

function valider() {
    if (!actif) {
        document.getElementById("r").innerText = "Token invalide ou déjà utilisé.";
        return;
    }
    actif = false;
    document.getElementById("r").innerText = "Token validé et détruit.";
}
</script>

</body>
</html>
