<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Validation Token</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="zone">
    <h1>Validation du Token</h1>

    <button onclick="genererToken()">Générer un Token</button>
    <p id="token"></p>

    <button onclick="validerToken()">Valider le Token</button>
    <p id="resultat"></p>
</div>

<script>
let token = null;
let tokenValide = false;

function genererToken() {
    token = "TKN-" + Math.floor(Math.random() * 999999);
    tokenValide = true;
    document.getElementById("token").innerText = "Votre token : " + token;
    document.getElementById("resultat").innerText = "";
}

function validerToken() {
    if (!tokenValide) {
        document.getElementById("resultat").innerText = "Token déjà utilisé ou invalide.";
        return;
    }

    tokenValide = false;
    document.getElementById("resultat").innerText = "Token validé et détruit.";
}
</script>

</body>
</html>
